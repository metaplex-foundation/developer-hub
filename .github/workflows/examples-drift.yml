name: Examples drift

# Fails when a src/examples/**/index.js is out of sync with the native
# source files (kit.js, umi.js, cli.sh, etc.) it's generated from, so a
# hand-edited source can no longer drift silently from the published docs.

on:
  pull_request:
    paths:
      - 'src/examples/**'
      - 'scripts/build-examples.js'
      - 'package.json'
      - '.github/workflows/examples-drift.yml'
  push:
    branches: [main]

# This job checks out and installs pull-request-controlled code, so it gets no
# more than read access and never keeps the checkout token on disk.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; a tag can be moved, a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build-examples

      - name: Fail if build-examples produced a diff
        run: |
          if ! git diff --quiet -- src/examples; then
            echo "::error::src/examples/**/index.js is out of sync with its source files. Run 'pnpm run build-examples' locally and commit the result."
            git diff --stat -- src/examples
            exit 1
          fi
